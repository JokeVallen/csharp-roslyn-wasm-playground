name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Publish runtime builds
        run: |
          chmod +x scripts/publish-all.sh
          ./scripts/publish-all.sh "/csharp-roslyn-wasm-playground/" "publish/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
